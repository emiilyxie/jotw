<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bounce Editor — Billie's Bounce</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a14; font-family: monospace; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    #header {
      padding: 8px 14px;
      background: #13131f;
      border-bottom: 1px solid #2a2a40;
      font-size: 12px;
      color: #666;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #header strong { color: #aaa; }

    #main { flex: 1; display: flex; overflow: hidden; }

    /* Piano roll */
    #roll-wrapper {
      flex: 1;
      overflow: auto;
      position: relative;
      cursor: crosshair;
      background: #0d0d1a;
    }
    #roll-canvas { display: block; }

    /* Legend */
    #legend {
      width: 180px;
      flex-shrink: 0;
      background: #13131f;
      border-left: 1px solid #2a2a40;
      overflow-y: auto;
      padding: 12px 10px;
    }
    #legend h3 { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 11px;
    }
    .legend-swatch {
      width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0;
    }
    .legend-shape { color: #666; font-size: 10px; }

    /* Status bar */
    #status {
      padding: 5px 14px;
      background: #13131f;
      border-top: 1px solid #2a2a40;
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #clear-btn {
      background: #1e1e30;
      color: #888;
      border: 1px solid #333;
      padding: 2px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-family: monospace;
    }
    #clear-btn:hover { background: #2a1a1a; color: #e88; border-color: #633; }

    /* Output */
    #output-panel {
      height: 180px;
      background: #0d1117;
      border-top: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #output-header {
      padding: 5px 14px;
      background: #161b22;
      font-size: 11px;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }
    #copy-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 2px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-family: monospace;
    }
    #copy-btn:hover { background: #388bfd; border-color: #388bfd; color: #fff; }
    #output-code {
      flex: 1;
      overflow: auto;
      padding: 8px 14px;
      font-size: 11px;
      color: #79c0ff;
      white-space: pre;
      line-height: 1.5;
    }

    #loading { padding: 40px; color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div id="header">
    <strong>Bounce Editor — Billie's Bounce</strong>
    <span>Click a note to mark it as a bounce &nbsp;·&nbsp; Click again to unmark &nbsp;·&nbsp; Copy output → paste into src/bounce-events.ts</span>
  </div>

  <div id="main">
    <div id="roll-wrapper">
      <canvas id="roll-canvas"></canvas>
      <div id="loading">Loading notes… run <code>npm run parse-midi</code> first if this hangs.</div>
    </div>
    <div id="legend">
      <h3>Pitch → Shape / Color</h3>
      <div id="legend-items"></div>
    </div>
  </div>

  <div id="status">
    <span id="status-text">0 bounce events</span>
    <button id="clear-btn" onclick="clearAll()">Clear all</button>
  </div>

  <div id="output-panel">
    <div id="output-header">
      <span>src/bounce-events.ts</span>
      <button id="copy-btn" onclick="copyOutput()">Copy</button>
    </div>
    <div id="output-code"></div>
  </div>

  <script>
    const FPS = 30;
    const PX_PER_SEC = 80;
    const SEMITONE_H = 10;
    const PITCH_PAD = 3;
    const ROLL_H = 360;

    const PITCH_COLORS = [
      "#ff4444", "#ff6b35", "#ffd700", "#9acd32",
      "#00bfff", "#1e90ff", "#9370db", "#ff69b4",
      "#ff1493", "#00ced1", "#32cd32", "#ff8c00",
    ];
    const PITCH_SHAPES = [
      "sphere", "sphere", "cube", "cube",
      "cylinder", "cylinder", "sphere", "cube",
      "cylinder", "sphere", "cube", "cylinder",
    ];
    const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    let notes = [];
    let totalDuration = 0;
    let bpm = 120;
    let bounceSet = new Set(); // indices into notes[]
    let minMidi = 60, maxMidi = 84;

    const canvas = document.getElementById("roll-canvas");
    const ctx = canvas.getContext("2d");

    fetch("./editor-notes.json")
      .then(r => r.json())
      .then(data => {
        notes = data.notes;
        totalDuration = data.totalDuration;
        bpm = data.bpm;

        minMidi = Math.min(...notes.map(n => n.midi)) - PITCH_PAD;
        maxMidi = Math.max(...notes.map(n => n.midi)) + PITCH_PAD;

        document.getElementById("loading").style.display = "none";

        canvas.width  = Math.ceil(totalDuration * PX_PER_SEC) + 40;
        canvas.height = (maxMidi - minMidi + 1) * SEMITONE_H;

        buildLegend();
        draw();
        updateOutput();
      })
      .catch(() => {
        document.getElementById("loading").textContent =
          "Could not load editor-notes.json — run: npm run parse-midi";
      });

    function pitchToY(midi) {
      return (maxMidi - midi) * SEMITONE_H;
    }

    function timeToX(t) {
      return t * PX_PER_SEC;
    }

    function draw() {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Background
      ctx.fillStyle = "#0d0d1a";
      ctx.fillRect(0, 0, W, H);

      // Semitone row highlights (black keys)
      const blackKeys = new Set([1, 3, 6, 8, 10]);
      for (let m = minMidi; m <= maxMidi; m++) {
        if (blackKeys.has(m % 12)) {
          ctx.fillStyle = "rgba(255,255,255,0.03)";
          ctx.fillRect(0, pitchToY(m), W, SEMITONE_H);
        }
      }

      // Beat grid
      const beatDur = 60 / bpm;
      ctx.lineWidth = 1;
      for (let beat = 0; beat * beatDur <= totalDuration + beatDur; beat++) {
        const x = Math.round(timeToX(beat * beatDur)) + 0.5;
        ctx.strokeStyle = beat % 4 === 0 ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.04)";
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }

      // Notes
      notes.forEach((note, i) => {
        const x = timeToX(note.time);
        const y = pitchToY(note.midi);
        const w = Math.max(3, note.duration * PX_PER_SEC - 1);
        const pc = note.midi % 12;
        const color = PITCH_COLORS[pc];
        const isBounce = bounceSet.has(i);

        if (isBounce) {
          ctx.shadowColor = color;
          ctx.shadowBlur = 10;
          ctx.fillStyle = color;
          ctx.fillRect(x, y + 1, w, SEMITONE_H - 2);
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x + 0.75, y + 1.75, w - 1.5, SEMITONE_H - 3.5);
        } else {
          ctx.fillStyle = color + "66";
          ctx.fillRect(x, y + 1, w, SEMITONE_H - 2);
        }
      });
    }

    // Click: find the topmost note under cursor and toggle it
    const wrapper = document.getElementById("roll-wrapper");
    canvas.addEventListener("click", e => {
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;

      for (let i = notes.length - 1; i >= 0; i--) {
        const note = notes[i];
        const nx = timeToX(note.time);
        const ny = pitchToY(note.midi) + 1;
        const nw = Math.max(3, note.duration * PX_PER_SEC - 1);
        const nh = SEMITONE_H - 2;
        if (cx >= nx && cx <= nx + nw && cy >= ny && cy <= ny + nh) {
          if (bounceSet.has(i)) bounceSet.delete(i);
          else bounceSet.add(i);
          draw();
          updateOutput();
          return;
        }
      }
    });

    function updateOutput() {
      const count = bounceSet.size;
      document.getElementById("status-text").textContent =
        `${count} bounce event${count !== 1 ? "s" : ""} selected`;

      const events = [...bounceSet]
        .sort((a, b) => notes[a].time - notes[b].time)
        .map(i => {
          const n = notes[i];
          const pc = n.midi % 12;
          return `  { frame: ${Math.round(n.time * FPS)}, shape: "${PITCH_SHAPES[pc]}", color: "${PITCH_COLORS[pc]}" },`;
        });

      document.getElementById("output-code").textContent =
`// Generated by editor.html — paste into src/bounce-events.ts
export type Shape = "sphere" | "cube" | "cylinder";
export interface BounceEvent {
  frame: number;
  shape: Shape;
  color: string;
}
export const BOUNCE_EVENTS: BounceEvent[] = [
${events.join("\n")}
];`;
    }

    function clearAll() {
      bounceSet.clear();
      draw();
      updateOutput();
    }

    function copyOutput() {
      const text = document.getElementById("output-code").textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copy-btn");
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy", 1500);
      });
    }

    function buildLegend() {
      const container = document.getElementById("legend-items");
      for (let pc = 0; pc < 12; pc++) {
        const row = document.createElement("div");
        row.className = "legend-row";

        const swatch = document.createElement("div");
        swatch.className = "legend-swatch";
        swatch.style.background = PITCH_COLORS[pc];

        const label = document.createElement("div");
        label.innerHTML = `<span style="color:#ccc">${NOTE_NAMES[pc]}</span> <span class="legend-shape">${PITCH_SHAPES[pc]}</span>`;

        row.appendChild(swatch);
        row.appendChild(label);
        container.appendChild(row);
      }
    }
  </script>
</body>
</html>
